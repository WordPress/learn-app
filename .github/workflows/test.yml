name: Tests

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tests-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  phpunit:
    name: Course-plan regression tests
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mariadb:11
        env:
          MARIADB_ROOT_PASSWORD: root
          MARIADB_DATABASE: wordpress_tests
        ports:
          - 3306:3306
        options: >-
          --health-cmd="healthcheck.sh --connect --innodb_initialized"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: mysqli, xml, mbstring
          coverage: none
          tools: composer:v2
      - name: Install test dependencies
        run: composer install --no-interaction --prefer-dist --no-progress
      - name: Download test WordPress
        run: curl -fsSL https://wordpress.org/latest.tar.gz | tar -xz -C /tmp
      - name: Run PHPUnit against the dedicated test database
        env:
          WP_CORE_DIR: /tmp/wordpress
          WP_TESTS_DB_NAME: wordpress_tests
          WP_TESTS_DB_USER: root
          WP_TESTS_DB_PASSWORD: root
          WP_TESTS_DB_HOST: 127.0.0.1
        run: composer test
